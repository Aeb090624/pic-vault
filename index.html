<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://api.github.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>图库</title>
<style>
  :root { --purple:#A855F7; --dark:#0d0818; --panel:#1a1030; --border:#3b1f6e; --text:#e0e0e0; --dim:#888; --red:#ff4444; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--dark); color:var(--text); font-family:'Segoe UI','Microsoft YaHei',sans-serif; }
  .header { position:sticky; top:0; z-index:100; background:rgba(10,10,15,0.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); padding:12px 20px; display:flex; align-items:center; justify-content:space-between; }
  .logo { font-size:18px; font-weight:700; letter-spacing:2px; color:var(--purple); }
  .del-btn { background:none; border:1px solid var(--red); color:var(--red); padding:7px 14px; border-radius:6px; cursor:pointer; font-size:13px; transition:all .2s; }
  .del-btn:hover { background:rgba(255,68,68,0.1); }
  .del-btn.on { background:var(--red); color:#fff; }
  .wrap { max-width:1200px; margin:0 auto; padding:20px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px; }
  .item { position:relative; background:var(--panel); border:1px solid var(--border); border-radius:8px; overflow:hidden; cursor:pointer; transition:border-color .2s; }
  .item:hover { border-color:var(--purple); }
  .item img { width:100%; aspect-ratio:9/16; object-fit:cover; display:block; background:#2a1a4e; }
  .item .name { padding:6px 8px; font-size:11px; word-break:break-all; color:var(--dim); }
  .delete-mode .item img { opacity:.85; }
  .check { position:absolute; top:8px; right:8px; z-index:6; width:26px; height:26px; border-radius:50%; border:2px solid #fff; background:rgba(0,0,0,.4); display:none; align-items:center; justify-content:center; font-size:14px; color:#fff; line-height:1; user-select:none; }
  .delete-mode .check { display:flex; }
  .check.checked { background:var(--red); border-color:var(--red); }
  .empty, .loading { text-align:center; padding:60px; color:var(--dim); }
  .toolbar { display:none; align-items:center; justify-content:center; gap:12px; padding:10px 20px; flex-wrap:wrap; }
  .toolbar.active { display:flex; }
  .toolbar .count { font-size:14px; }
  .toolbar .count b { color:var(--red); font-size:16px; }
  .btn { padding:8px 18px; border-radius:6px; cursor:pointer; font-size:14px; border:none; }
  .btn-danger { background:var(--red); color:#fff; }
  .btn-cancel { background:none; color:var(--dim); border:1px solid var(--border); }
  /* 查看器：App 式 0.2s 放大过渡 */
  .viewer { position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.95); display:flex; align-items:center; justify-content:center; opacity:0; visibility:hidden; transition:opacity .2s ease-out, visibility 0s linear .2s; }
  .viewer.active { opacity:1; visibility:visible; transition:opacity .2s ease-out; }
  .viewer img { max-width:90vw; max-height:76vh; object-fit:contain; border-radius:4px; will-change:transform, opacity; }
  .viewer-close { position:absolute; top:20px; right:24px; background:none; border:none; color:#fff; font-size:32px; cursor:pointer; opacity:.7; }
  .viewer-close:hover { opacity:1; }
  .viewer-info { position:absolute; bottom:22px; left:50%; transform:translateX(-50%); display:flex; gap:12px; align-items:center; }
  .viewer-download { background:var(--purple); color:#fff; border:none; padding:10px 24px; border-radius:6px; cursor:pointer; font-size:14px; font-weight:600; text-decoration:none; display:inline-block; }
  .viewer-download:hover { background:#c084fc; }
  .viewer-nav { position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.1); border:none; color:#fff; width:46px; height:46px; border-radius:50%; cursor:pointer; font-size:22px; display:flex; align-items:center; justify-content:center; }
  .viewer-nav:hover { background:rgba(255,255,255,.2); }
  .viewer-prev { left:20px; } .viewer-next { right:20px; }
  /* 弹窗 */
  .modal-mask { position:fixed; inset:0; z-index:300; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; }
  .modal-mask.active { display:flex; }
  .modal { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:26px; width:90%; max-width:400px; }
  .modal h3 { font-size:17px; margin-bottom:14px; color:var(--purple); }
  .modal p { font-size:12px; color:var(--dim); margin-bottom:10px; line-height:1.6; }
  .modal input { width:100%; padding:10px 12px; background:var(--dark); border:1px solid var(--border); border-radius:6px; color:var(--text); font-size:14px; outline:none; }
  .modal input:focus { border-color:var(--purple); }
  .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }
  /* Toast */
  .toast { position:fixed; top:80px; left:50%; transform:translateX(-50%); background:var(--panel); border:1px solid var(--border); padding:12px 24px; border-radius:8px; z-index:500; font-size:14px; display:none; max-width:80%; }
  .toast.active { display:block; }
  .toast.success { border-color:#00ff88; color:#00ff88; }
  .toast.error { border-color:var(--red); color:var(--red); }
  @media (max-width:600px) { .grid { grid-template-columns:repeat(2,1fr); gap:10px; } .wrap { padding:12px; } }
</style>
</head>
<body>
<div class="header">
  <div class="logo">图片存储库</div>
  <button class="del-btn" id="delBtn" onclick="toggleDeleteMode()">🗑 删除</button>
</div>
<div class="toolbar" id="toolbar">
  <span class="count">已选 <b id="selCount">0</b> 张</span>
  <button class="btn btn-danger" onclick="batchDelete()">删除选中</button>
  <button class="btn btn-cancel" onclick="toggleDeleteMode()">取消</button>
</div>
<div class="wrap">
  <div id="grid" class="grid"><div class="loading">加载中…</div></div>
</div>

<!-- 查看器 -->
<div class="viewer" id="viewer">
  <button class="viewer-close" onclick="closeViewer()">×</button>
  <button class="viewer-nav viewer-prev" onclick="navViewer(-1)">‹</button>
  <img id="viewerImg" src="" alt="" decoding="async">
  <button class="viewer-nav viewer-next" onclick="navViewer(1)">›</button>
  <div class="viewer-info">
    <a class="viewer-download" id="viewerDownload" href="" download>下载壁纸</a>
  </div>
</div>

<!-- Token 弹窗（删除权限，只存本地） -->
<div class="modal-mask" id="tokenModal">
  <div class="modal">
    <h3>删除权限确认</h3>
    <p>删除图片需要 GitHub Token 权限。Token 仅保存在你当前浏览器中（localStorage），不会上传到任何服务器。别人打开这个站无法删除。</p>
    <input type="password" id="tokenInput" placeholder="粘贴 GitHub Token" autocomplete="off">
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeTokenModal()">取消</button>
      <button class="btn btn-danger" onclick="saveToken()">确认</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const OWNER='Aeb090624', REPO='pic-vault', BRANCH='main';
let state = { images: [], deleteMode: false, selectedIds: new Set(), viewerIndex: 0, viewerList: [], viewerFrom: null };
let toastTimer = null;

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function getToken(){ return localStorage.getItem('vault_token') || ''; }
function showToast(msg, type){
  const t=document.getElementById('toast');
  if(toastTimer) clearTimeout(toastTimer);
  t.textContent=msg; t.className='toast active '+(type||'success');
  toastTimer=setTimeout(()=>t.classList.remove('active'),3000);
}
async function fetchWithTimeout(url, options, timeoutMs){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(), timeoutMs||60000);
  try { return await fetch(url, {...options, signal:ctrl.signal}); }
  finally { clearTimeout(timer); }
}

// ===== 渲染 =====
async function load(){
  const grid=document.getElementById('grid');
  try {
    const res=await fetch('manifest.json?t='+Date.now());
    if(!res.ok) throw new Error('bad');
    const data=await res.json();
    state.images=data.images||[];
    render();
  } catch(e){ grid.innerHTML='<div class="empty">加载失败，请刷新重试</div>'; }
}

function render(){
  const grid=document.getElementById('grid');
  const list=state.images.slice().reverse();
  if(!list.length){ grid.innerHTML='<div class="empty">暂无图片</div>'; return; }
  grid.innerHTML=list.map((im,idx)=>{
    const id=esc(im.id||('img_'+idx));
    const sel=state.selectedIds.has(id);
    return '<div class="item" data-id="'+id+'" onclick="onCardClick(\''+id+'\','+idx+',this)">'
      +'<div class="check '+(sel?'checked':'')+'">'+(sel?'✓':'')+'</div>'
      +'<img src="'+esc(im.thumb||im.path)+'" alt="'+esc(im.name)+'" loading="lazy" decoding="async">'
      +'<div class="name">'+esc(im.name)+'</div>'
      +'</div>';
  }).join('');
}

function onCardClick(id, idx, el){
  if(state.deleteMode){
    if(state.selectedIds.has(id)) state.selectedIds.delete(id); else state.selectedIds.add(id);
    const c=el.querySelector('.check');
    c.classList.toggle('checked', state.selectedIds.has(id));
    c.textContent=state.selectedIds.has(id)?'✓':'';
    document.getElementById('selCount').textContent=state.selectedIds.size;
    return;
  }
  openViewer(idx, el);
}

// ===== 查看器 =====
function openViewer(idx, cardEl){
  const list=state.images.slice().reverse();
  state.viewerList=list; state.viewerIndex=idx;
  updateViewer();
  const viewer=document.getElementById('viewer'), img=document.getElementById('viewerImg');
  viewer.classList.add('active');
  document.body.style.overflow='hidden';
  state.viewerFrom=null;
  if(cardEl && typeof cardEl.getBoundingClientRect==='function'){
    const r=cardEl.getBoundingClientRect();
    const cardImg=cardEl.querySelector('img');
    const vw=window.innerWidth, vh=window.innerHeight;
    const asp=(cardImg&&cardImg.naturalWidth)?cardImg.naturalWidth/cardImg.naturalHeight:9/16;
    const W=Math.min(vw*0.9, vh*0.76*asp);
    const s=Math.min(r.width/W,1);
    const dx=(r.left+r.width/2)-vw/2, dy=(r.top+r.height/2)-vh/2;
    state.viewerFrom={dx:dx,dy:dy,s:s};
    img.style.transition='none';
    img.style.transform='translate('+dx+'px,'+dy+'px) scale('+s+')';
    img.style.opacity='0';
    void img.offsetWidth;
    img.style.transition='transform .2s cubic-bezier(.3,.75,.25,1), opacity .2s ease-out';
    img.style.transform='none';
    img.style.opacity='1';
  }
}

function updateViewer(){
  const im=state.viewerList[state.viewerIndex];
  if(!im) return;
  document.getElementById('viewerImg').src=im.path;
  const dl=document.getElementById('viewerDownload');
  dl.href=im.path; dl.download=im.name||'image.jpg';
  const n=state.viewerList.length;
  const nxt=state.viewerList[(state.viewerIndex+1)%n], prv=state.viewerList[(state.viewerIndex-1+n)%n];
  [nxt,prv].forEach(x=>{ if(x){ const p=new Image(); p.src=x.path; } });
}

function closeViewer(){
  const viewer=document.getElementById('viewer'), img=document.getElementById('viewerImg');
  const f=state.viewerFrom;
  document.body.style.overflow='';
  if(f){
    img.style.transition='transform .2s cubic-bezier(.6,0,.45,1), opacity .2s ease-in';
    img.style.transform='translate('+f.dx+'px,'+f.dy+'px) scale('+f.s+')';
    img.style.opacity='0';
    setTimeout(()=>{ if(state.viewerFrom===f){ viewer.classList.remove('active'); state.viewerFrom=null; } },210);
  } else { viewer.classList.remove('active'); state.viewerFrom=null; }
}

function navViewer(dir){
  const img=document.getElementById('viewerImg');
  img.style.transition='none'; img.style.transform='none'; img.style.opacity='1';
  state.viewerIndex=(state.viewerIndex+dir+state.viewerList.length)%state.viewerList.length;
  updateViewer();
}

document.getElementById('viewer').addEventListener('click', e=>{ if(e.target===e.currentTarget) closeViewer(); });
document.addEventListener('keydown', e=>{
  if(document.getElementById('viewer').classList.contains('active')){
    if(e.key==='Escape') closeViewer();
    if(e.key==='ArrowLeft') navViewer(-1);
    if(e.key==='ArrowRight') navViewer(1);
  }
});

// ===== 删除（无管理员模式，Token 只存本地） =====
function toggleDeleteMode(){
  if(state.deleteMode){ exitDeleteMode(); return; }
  if(!getToken()){ document.getElementById('tokenModal').classList.add('active'); return; }
  enterDeleteMode();
}
function enterDeleteMode(){
  state.deleteMode=true; state.selectedIds.clear();
  document.getElementById('delBtn').classList.add('on');
  document.getElementById('toolbar').classList.add('active');
  document.body.classList.add('delete-mode');
  document.getElementById('selCount').textContent='0';
  render();
}
function exitDeleteMode(){
  state.deleteMode=false; state.selectedIds.clear();
  document.getElementById('delBtn').classList.remove('on');
  document.getElementById('toolbar').classList.remove('active');
  document.body.classList.remove('delete-mode');
  render();
}
function closeTokenModal(){ document.getElementById('tokenModal').classList.remove('active'); }
function saveToken(){
  const t=document.getElementById('tokenInput').value.trim();
  if(t.length<20){ showToast('Token 似乎不完整，请完整粘贴','error'); return; }
  localStorage.setItem('vault_token', t);
  document.getElementById('tokenModal').classList.remove('active');
  showToast('权限已确认，可开始删除');
  enterDeleteMode();
}

async function batchDelete(){
  const ids=Array.from(state.selectedIds);
  if(!ids.length){ showToast('请先勾选要删除的图片','error'); return; }
  if(!confirm('确定删除选中的 '+ids.length+' 张图片？删除后无法恢复。')) return;
  const token=getToken();
  const headers={'Authorization':'token '+token,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'};
  const toRemove=state.images.filter(i=>ids.includes(i.id));
  const shaRes=await runWithConcurrency(toRemove,4,async img=>{
    const fr=await fetchWithTimeout('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+img.path+'?ref='+BRANCH+'&t='+Date.now(),{headers});
    if(fr.status===404) return {img:img,sha:null,missing:true};
    if(!fr.ok) throw new Error('获取文件信息失败');
    const fd=await fr.json();
    return {img:img,sha:fd.sha,missing:false};
  });
  let okCount=0;
  const delRes=await runWithConcurrency(shaRes.filter(r=>r.ok&&!r.value.missing),4,async r=>{
    const dr=await fetchWithTimeout('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+r.value.img.path,{method:'DELETE',headers,body:JSON.stringify({message:'删除图片: '+r.value.img.name,sha:r.value.sha,branch:BRANCH})});
    if(!dr.ok) throw new Error('删除请求失败');
  });
  delRes.forEach(r=>{ if(r.ok) okCount++; });
  okCount+=shaRes.filter(r=>r.ok&&r.value.missing).length;
  const removed=shaRes.filter(r=>r.ok).map(r=>r.value.img);
  let listSaved=true;
  if(removed.length){
    try{ await updateManifest('removeMany',removed); }catch(e){ listSaved=false; }
  }
  const rmIds=new Set(removed.map(i=>i.id));
  state.images=state.images.filter(i=>!rmIds.has(i.id));
  exitDeleteMode();
  if(!listSaved && removed.length){ showToast('文件已删除，但列表更新失败，刷新后可能短暂出现','error'); }
  else showToast(okCount>0?'已删除 '+okCount+' 张图片':'删除失败', okCount>0?'success':'error');
}

async function runWithConcurrency(items, limit, fn){
  const results=new Array(items.length); let idx=0;
  const workers=Array(Math.min(limit,items.length)).fill(0).map(async()=>{
    while(idx<items.length){ const cur=idx++; try{ results[cur]={ok:true,value:await fn(items[cur],cur)}; }catch(e){ results[cur]={ok:false,error:e}; } }
  });
  await Promise.all(workers);
  return results;
}

async function updateManifest(action, item){
  const token=getToken();
  const headers={'Authorization':'token '+token,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'};
  let lastErr=null;
  for(let attempt=0;attempt<3;attempt++){
    if(attempt>0) await new Promise(r=>setTimeout(r,1500*attempt));
    try{
      const res=await fetchWithTimeout('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/manifest.json?ref='+BRANCH+'&t='+Date.now(),{headers});
      let manifest={images:[]}, sha=null;
      if(res.ok){ const d=await res.json(); sha=d.sha; try{ manifest=JSON.parse(atob(d.content.replace(/\n/g,''))); }catch(e){ manifest={images:[]}; } }
      if(action==='removeMany'){
        const ids=new Set((Array.isArray(item)?item:[item]).map(i=>i.id));
        manifest.images=manifest.images.filter(i=>!ids.has(i.id));
      }
      const content=btoa(unescape(encodeURIComponent(JSON.stringify(manifest,null,2))));
      const putRes=await fetchWithTimeout('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/manifest.json',{method:'PUT',headers,body:JSON.stringify({message:'更新图片清单',content:content,sha:sha,branch:BRANCH})});
      if(!putRes.ok){ const err=await putRes.json().catch(()=>({})); throw new Error(err.message||'更新列表失败'); }
      return true;
    }catch(e){ lastErr=e; }
  }
  throw lastErr;
}

// 弹窗遮罩点击关闭
document.querySelectorAll('.modal-mask').forEach(mask=>{
  mask.addEventListener('click',e=>{ if(e.target===mask) mask.classList.remove('active'); });
});

load();
</script>
</body>
</html>
